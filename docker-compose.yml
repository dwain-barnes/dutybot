services:
  # --- CPU llama.cpp server (default, runs with `docker compose up`) ---
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: dutybot-llama
    networks:
      default:
        aliases:
          - llama-server
    volumes:
      - models:/models
      - ./llama-server/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - MODEL_REPO=${MODEL_REPO:-EryriLabs/dutybot-GGUF}
      - MODEL_FILE=${MODEL_FILE:-domain_adapted-Q4_K_M.gguf}
      - CTX_SIZE=${CTX_SIZE:-4096}
      - N_GPU_LAYERS=0
      - CHAT_TEMPLATE=${CHAT_TEMPLATE:-chatml}
    ports:
      # Loopback only: the raw llama.cpp API has no auth and no system prompt,
      # so it must not be reachable from the LAN.
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # --- CUDA llama.cpp server (use: docker compose --profile cuda up --scale llama-server=0) ---
  llama-server-cuda:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["cuda"]
    container_name: dutybot-llama-cuda
    networks:
      default:
        aliases:
          - llama-server
    volumes:
      - models:/models
      - ./llama-server/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - MODEL_REPO=${MODEL_REPO:-EryriLabs/dutybot-GGUF}
      - MODEL_FILE=${MODEL_FILE:-domain_adapted-Q4_K_M.gguf}
      - CTX_SIZE=${CTX_SIZE:-4096}
      - N_GPU_LAYERS=${N_GPU_LAYERS:-999}
      - CHAT_TEMPLATE=${CHAT_TEMPLATE:-chatml}
    ports:
      # Loopback only: the raw llama.cpp API has no auth and no system prompt,
      # so it must not be reachable from the LAN.
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # --- SearXNG ---
  searxng:
    image: searxng/searxng:latest
    container_name: dutybot-searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    ports:
      # Loopback only: with the limiter disabled this would otherwise be an
      # open, unauthenticated search proxy for anyone on the network.
      - "127.0.0.1:${SEARXNG_PORT:-4000}:8080"
    restart: unless-stopped

  # --- DutyBot App ---
  dutybot:
    build: ./dutybot
    container_name: dutybot-app
    volumes:
      - dutybot-data:/app/data
    ports:
      - "${DUTYBOT_PORT:-5000}:5000"
    environment:
      - LLAMA_URL=http://llama-server:8080
      - SEARXNG_URL=http://searxng:8080
      - DATABASE_PATH=/app/data/dutybot.db
      - MAX_CONTEXT_MESSAGES=${MAX_CONTEXT_MESSAGES:-20}
      - CTX_SIZE=${CTX_SIZE:-4096}
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  models:
  dutybot-data:
